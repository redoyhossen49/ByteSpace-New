allowBuilds:
  sharp: false
  unrs-resolver: false

# browserslist refreshes this data package several times a day, so a lockfile
# entry published in the last 24h fails the build on hosts that run pnpm with
# minimumReleaseAge (Vercel). Pinning to an older release satisfies the
# supply-chain policy instead of disabling it.
overrides:
  electron-to-chromium: 1.5.440
